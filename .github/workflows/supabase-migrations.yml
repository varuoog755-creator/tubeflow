name: Supabase Migrations

# Applies anything new in supabase/migrations/ to the production database.
# This is the piece that makes "push to GitHub -> database updated" true.
on:
  push:
    branches: ["main"]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    # `environment` is a job-level key, not a workflow-level one. Declaring it
    # at the top level makes GitHub reject the whole file with
    # "Unexpected value 'environment'" before any job is created.
    #
    # `Production` is an existing environment on this repository and names are
    # case sensitive, so it must match exactly.
    #
    # Add required reviewers under Settings -> Environments -> Production to
    # gate schema changes on a human. It currently has no protection rules, so
    # migrations apply without a prompt.
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link \
            --project-ref "${{ vars.SUPABASE_PROJECT_ID }}" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Show pending migrations
        id: diff
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db push --dry-run | tee "$RUNNER_TEMP/migrations.log"

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --include-all