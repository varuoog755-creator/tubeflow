name: Supabase Migrations

# Applies anything new in supabase/migrations/ to the production database.
# This is the piece that makes "push to GitHub -> database updated" true.
on:
  push:
    branches: ["main"]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

# `Production` is an existing GitHub Environment on this repository. Environment
# names are case sensitive, so this must match the name exactly - referring to a
# lowercase `production` makes the run fail before any job is created.
#
# Add required reviewers to it (Settings -> Environments -> Production ->
# Required reviewers) so that migrations cannot be applied to the live database
# without a human approving. It currently has no protection rules, so migrations
# apply without a prompt.
environment: Production

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link \
            --project-ref "${{ vars.SUPABASE_PROJECT_ID }}" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Show pending migrations
        id: diff
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase db push --dry-run | tee "$RUNNER_TEMP/migrations.log"

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --include-all